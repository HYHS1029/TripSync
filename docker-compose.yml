services:
  db:
    image: postgres:18-alpine
    container_name: tripsync-db

    environment:
      POSTGRES_USER: tripsync
      POSTGRES_PASSWORD: tripsync_dev
      POSTGRES_DB: tripsync

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tripsync -d tripsync"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:v1.27.4
    profiles: ["mail"]
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    environment:
      MP_MAX_MESSAGES: 100

volumes:
  postgres_data:
